<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter One Fitness — Workout System</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --charcoal: #141414;
    --panel: #1a1a1a;
    --border: #2a2a2a;
    --teal: #00c9a7;
    --teal-dim: #00896f;
    --yellow: #f5c518;
    --white: #f0f0f0;
    --muted: #888;
    --red: #e05252;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: var(--charcoal);
    border-bottom: 1px solid var(--border);
    padding: 24px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 3px;
    color: var(--teal);
  }

  .logo span { color: var(--yellow); }

  .week-badge {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 4px;
    color: var(--muted);
  }

  .week-badge strong { color: var(--teal); }

  /* GOAL BAR */
  .goal-bar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 32px;
    display: flex;
    gap: 32px;
    align-items: center;
    flex-wrap: wrap;
  }

  .goal-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .goal-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .goal-value {
    font-size: 15px;
    font-weight: 600;
    color: var(--white);
  }

  .goal-value.highlight { color: var(--teal); }

  /* EMPHASIS BANNER */
  .emphasis-banner {
    margin: 24px 32px 0;
    background: linear-gradient(135deg, #0d2e28 0%, #0a1a16 100%);
    border: 1px solid var(--teal-dim);
    border-radius: 8px;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .emphasis-icon {
    font-size: 28px;
  }

  .emphasis-text h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--teal);
  }

  .emphasis-text p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* WEEK GRID */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    padding: 20px 32px;
  }

  .day-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.2s;
  }

  .day-card:hover { border-color: var(--teal-dim); transform: translateY(-2px); }
  .day-card.active { border-color: var(--teal); }
  .day-card.saturday { border-color: var(--yellow); }

  .day-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .day-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 1.5px;
    color: var(--white);
  }

  .day-card.saturday .day-name { color: var(--yellow); }

  .day-tag {
    font-size: 9px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 3px;
    text-transform: uppercase;
  }

  .tag-emphasis { background: #0d2e28; color: var(--teal); }
  .tag-support { background: #1a1a1a; color: var(--muted); }
  .tag-fullbody { background: #2a2200; color: var(--yellow); }
  .tag-conditioning { background: #1a0d0d; color: var(--red); }

  .day-body { padding: 12px 14px; }

  .workout-name {
    font-weight: 600;
    font-size: 13px;
    color: var(--white);
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .workout-muscles {
    font-size: 11px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    line-height: 1.5;
  }

  .view-btn {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 8px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--teal);
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.2s;
    text-align: center;
  }

  .view-btn:hover { background: #0d2e28; border-color: var(--teal); }
  .day-card.saturday .view-btn { color: var(--yellow); }
  .day-card.saturday .view-btn:hover { background: #2a2200; border-color: var(--yellow); }

  /* SHUFFLE CONTROLS */
  .controls {
    display: flex;
    gap: 12px;
    padding: 0 32px 24px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn-shuffle {
    background: var(--teal);
    color: var(--black);
    border: none;
    padding: 12px 28px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn-shuffle:hover { opacity: 0.85; transform: scale(1.02); }
  .btn-shuffle:active { transform: scale(0.98); }

  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 11px 22px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-secondary:hover { border-color: var(--muted); color: var(--white); }

  .shuffle-info {
    font-size: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    margin-left: auto;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    overflow-y: auto;
    padding: 40px 20px;
  }

  .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }

  .modal {
    background: var(--charcoal);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 680px;
    overflow: hidden;
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-header {
    padding: 24px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .modal-day-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--teal);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 2px;
    color: var(--white);
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 24px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
  }

  .modal-close:hover { color: var(--white); }

  .modal-body { padding: 24px 28px; }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 2px;
    color: var(--teal);
    margin-bottom: 10px;
    margin-top: 22px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .section-title:first-child { margin-top: 0; }

  .exercise-table {
    width: 100%;
    border-collapse: collapse;
  }

  .exercise-table th {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--muted);
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
  }

  .exercise-table td {
    padding: 10px 10px;
    font-size: 13px;
    border-bottom: 1px solid #1e1e1e;
    vertical-align: top;
  }

  .exercise-table tr:last-child td { border-bottom: none; }

  .exercise-name { font-weight: 500; color: var(--white); }
  .exercise-detail { color: var(--muted); font-family: 'Space Mono', monospace; font-size: 11px; }
  .exercise-note { color: var(--muted); font-size: 11px; font-style: italic; }

  .warmup-list, .cooldown-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .warmup-list li, .cooldown-list li {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  .warmup-list li::before, .cooldown-list li::before {
    content: '→';
    color: var(--teal);
    font-family: 'Space Mono', monospace;
    flex-shrink: 0;
  }

  .finisher-block {
    background: #0d0d0d;
    border: 1px solid var(--border);
    border-left: 3px solid var(--red);
    border-radius: 6px;
    padding: 14px 16px;
  }

  .finisher-block p { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .finisher-block strong { color: var(--white); }

  .note-block {
    background: #0d2e28;
    border: 1px solid var(--teal-dim);
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 12px;
    color: var(--muted);
    margin-top: 16px;
    line-height: 1.6;
  }

  /* PROGRESS TRACKER */
  .progress-section {
    margin: 0 32px 32px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
  }

  .progress-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--white);
    margin-bottom: 16px;
  }

  .progress-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
  }

  .progress-item label {
    display: block;
    font-size: 11px;
    letter-spacing: 1px;
    font-family: 'Space Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .progress-item input {
    width: 100%;
    background: var(--charcoal);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 12px;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .progress-item input:focus { border-color: var(--teal); }

  .save-btn {
    margin-top: 14px;
    background: transparent;
    border: 1px solid var(--teal-dim);
    color: var(--teal);
    padding: 9px 20px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .save-btn:hover { background: #0d2e28; }

  .saved-msg {
    font-size: 11px;
    color: var(--teal);
    font-family: 'Space Mono', monospace;
    margin-left: 12px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .saved-msg.show { opacity: 1; }

  /* WEEK EMPHASIS TRACKER */
  .emphasis-dots {
    display: flex;
    gap: 6px;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
  }

  .dot.done { background: var(--teal); }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .week-grid { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 600px) {
    .header { padding: 16px 20px; }
    .week-grid { padding: 16px 20px; grid-template-columns: repeat(2, 1fr); }
    .controls { padding: 0 20px 20px; }
    .emphasis-banner { margin: 16px 20px 0; }
    .progress-section { margin: 0 20px 24px; }
    .goal-bar { padding: 10px 20px; gap: 20px; }
  }
</style>
</head>

</div>

<div class="progress-section">

    <div class="progress-item">
      <label>Longest Run (miles)</label>
      <input type="number" id="trackRun" placeholder="0">
    </div>
    <div class="progress-item">
      <label>Weeks Completed</label>
      <input type="number" id="trackWeeks" placeholder="0">
    </div>
  </div>
  <button class="save-btn" onclick="saveProgress()">SAVE PROGRESS</button>
  <span class="saved-msg" id="savedMsg">✓ Saved!</span>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <div class="modal-day-label" id="modalDayLabel"></div>
        <div class="modal-title" id="modalTitle"></div>
      </div>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

// ============================================================
// STATE
// ============================================================

let currentWeekIndex = 0;
let weekAssignments = [];
let savedProgress = {};

function getWorkoutsByCategory(cat) {
  return WORKOUTS.filter(w => w.category === cat);
}

function pickRandom(arr, exclude = []) {
  const pool = arr.filter(w => !exclude.includes(w.id));
  if (!pool.length) return arr[Math.floor(Math.random() * arr.length)];
  return pool[Math.floor(Math.random() * pool.length)];
}

function generateWeekAssignment(cycleIndex) {
  const cycle = CYCLES[cycleIndex % CYCLES.length];
  const used = [];
  const assignments = [];

  for (let i = 0; i < 6; i++) {
    const cat = cycle.dayCategories[i];
    const pool = getWorkoutsByCategory(cat);
    const w = pickRandom(pool, used);
    used.push(w.id);
    assignments.push(w);
  }

  return { cycle, assignments };
}

function buildWeeks(count) {
  const result = [];
  for (let i = 0; i < count; i++) {
    result.push(generateWeekAssignment(i));
  }
  return result;
}

function init() {
  // Load saved progress
  try {
    const saved = localStorage.getItem('workoutProgress');
    if (saved) savedProgress = JSON.parse(saved);
  } catch(e) {}

  // Load saved week
  try {
    const savedWeek = localStorage.getItem('currentWeek');
    if (savedWeek !== null) currentWeekIndex = parseInt(savedWeek);
  } catch(e) {}

  // Generate enough weeks
  weekAssignments = buildWeeks(60);

  // Auto advance to current week based on date
  const now = new Date();
  const startOfYear = new Date(now.getFullYear(), 0, 1);
  const weekNum = Math.floor((now - startOfYear) / (7 * 24 * 60 * 60 * 1000));

  renderWeek();
  loadProgress();
}

function renderWeek() {
  while (weekAssignments.length <= currentWeekIndex + 5) {
    weekAssignments.push(generateWeekAssignment(weekAssignments.length));
  }

  const { cycle, assignments } = weekAssignments[currentWeekIndex];

  // Update header
  document.getElementById('weekNum').textContent = currentWeekIndex + 1;
  document.getElementById('cycleNum').textContent = cycle.id;
  document.getElementById('emphasisIcon').textContent = cycle.icon;
  document.getElementById('emphasisTitle').textContent = `WEEK ${currentWeekIndex + 1}: ${cycle.name.toUpperCase()}`;
  document.getElementById('emphasisDesc').textContent = cycle.desc;

  // Render day cards
  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';

  assignments.forEach((workout, i) => {
    const day = DAYS[i];
    const isSat = i === 5;
    const card = document.createElement('div');
    card.className = `day-card${isSat ? ' saturday' : ''}`;

    const tagClass = isSat ? 'tag-fullbody' : (workout.tag === 'conditioning' ? 'tag-conditioning' : (workout.tag === 'emphasis' ? 'tag-emphasis' : 'tag-support'));
    const tagLabel = isSat ? 'Full Body' : (workout.tag === 'conditioning' ? 'Conditioning' : (workout.tag === 'emphasis' ? 'Emphasis' : 'Support'));

    card.innerHTML = `
      <div class="day-header">
        <span class="day-name">${day}</span>
        <span class="day-tag ${tagClass}">${tagLabel}</span>
      </div>
      <div class="day-body">
        <div class="workout-name">${workout.name}</div>
        <div class="workout-muscles">${workout.muscles}</div>
        <button class="view-btn" onclick="openModal(${WORKOUTS.indexOf(workout)})">VIEW WORKOUT →</button>
      </div>
    `;
    grid.appendChild(card);
  });

  // Save current week
  try { localStorage.setItem('currentWeek', currentWeekIndex); } catch(e) {}

  // Update shuffle info
  document.getElementById('shuffleInfo').textContent = `Cycle ${cycle.id} — ${cycle.name}`;
}

function shuffleWeek() {
  const currentCycle = weekAssignments[currentWeekIndex];
  const cycleIndex = CYCLES.findIndex(c => c.id === currentCycle.cycle.id);
  weekAssignments[currentWeekIndex] = generateWeekAssignment(cycleIndex);
  renderWeek();
}

function nextWeek() {
  currentWeekIndex++;
  renderWeek();
}

function prevWeek() {
  if (currentWeekIndex > 0) {
    currentWeekIndex--;
    renderWeek();
  }
}

function openModal(workoutIndex) {
  const workout = WORKOUTS[workoutIndex];
  const dayIndex = weekAssignments[currentWeekIndex]?.assignments.findIndex(w => w.id === workout.id);
  const dayName = dayIndex >= 0 ? DAYS[dayIndex] : '';

  document.getElementById('modalDayLabel').textContent = dayName ? `${dayName.toUpperCase()} — WEEK ${currentWeekIndex + 1}` : workout.category.toUpperCase();
  document.getElementById('modalTitle').textContent = workout.name;

  let html = '';

  // Warmup
  html += `<div class="section-title">🔥 WARM-UP</div>`;
  html += `<ul class="warmup-list">`;
  workout.warmup.forEach(w => { html += `<li>${w}</li>`; });
  html += `</ul>`;

  // Main exercises
  html += `<div class="section-title">💪 MAIN WORKOUT</div>`;
  html += `<table class="exercise-table">
    <thead><tr>
      <th>Exercise</th>
      <th>Sets</th>
      <th>Reps</th>
      <th>Rest</th>
    </tr></thead><tbody>`;
  workout.exercises.forEach(e => {
    html += `<tr>
      <td>
        <div class="exercise-name">${e.name}</div>
        ${e.note ? `<div class="exercise-note">${e.note}</div>` : ''}
      </td>
      <td class="exercise-detail">${e.sets}</td>
      <td class="exercise-detail">${e.reps}</td>
      <td class="exercise-detail">${e.rest || '—'}</td>
    </tr>`;
  });
  html += `</tbody></table>`;

  // Finisher
  html += `<div class="section-title">⚡ CARDIO FINISHER</div>`;
  html += `<div class="finisher-block"><p>${workout.finisher}</p></div>`;

  // Cooldown
  html += `<div class="section-title">🧘 COOL-DOWN</div>`;
  html += `<ul class="cooldown-list">
    <li>5 min slow treadmill walk at 2.5 mph</li>
    <li>Quad stretch 30 sec each leg</li>
    <li>Chest opener stretch 30 sec</li>
    <li>Lat stretch on rack 20 sec each</li>
    <li>Hip flexor lunge stretch 30 sec each</li>
    <li>Foam roll any tight areas 2 min</li>
  </ul>`;

  // Notes
  if (workout.note) {
    html += `<div class="note-block">📋 <strong>Coach's Note:</strong> ${workout.note}</div>`;
  }

  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('open');
  }
}

function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function saveProgress() {
  savedProgress = {
    weight: document.getElementById('trackWeight').value,
    bf: document.getElementById('trackBF').value,
    run: document.getElementById('trackRun').value,
    weeks: document.getElementById('trackWeeks').value,
    updated: new Date().toLocaleDateString()
  };
  try {
    localStorage.setItem('workoutProgress', JSON.stringify(savedProgress));
  } catch(e) {}
  const msg = document.getElementById('savedMsg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 2000);
}

function loadProgress() {
  if (savedProgress.weight) document.getElementById('trackWeight').value = savedProgress.weight;
  if (savedProgress.bf) document.getElementById('trackBF').value = savedProgress.bf;
  if (savedProgress.run) document.getElementById('trackRun').value = savedProgress.run;
  if (savedProgress.weeks) document.getElementById('trackWeeks').value = savedProgress.weeks;
}

// Start
init();
</script>
</body>
</html>
